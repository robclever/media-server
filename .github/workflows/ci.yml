name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - run: python3 -m unittest discover -s scripts -p 'test_deploy_pi.py'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features
  container:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: custom-plex:ci
          platforms: ${{ matrix.platform }}
      - name: Generate playback fixture
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          mkdir -p media data
          ffmpeg -f lavfi -i color=c=blue:s=320x240:d=1 -c:v libx264 -pix_fmt yuv420p media/sample.mp4
          sudo chown -R 10001:10001 data
      - name: Start and verify container
        run: |
          PLEX_IMAGE=custom-plex:ci docker compose up -d --no-build --pull never --wait
          python3 scripts/smoke.py
          PLEX_IMAGE=custom-plex:ci python3 scripts/container_check.py
          PLEX_IMAGE=custom-plex:ci python3 scripts/multi_source_check.py
      - name: Container logs
        if: always()
        run: docker compose logs --no-color
      - name: Stop container
        if: always()
        run: docker compose down
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rust, container]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
